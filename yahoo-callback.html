<!doctype html>
<meta charset="utf-8">
<title>Yahoo Authorization</title>
<style>body{font-family:system-ui;margin:40px;max-width:700px}</style>
<h2>Yahoo authorization received</h2>
<p id="m">Completing the secure connection to your local Fantasy Football Intelligence Engine…</p>
<script>
const target=new URL("http://127.0.0.1:8787/api/yahoo/callback");
const q=new URLSearchParams(location.search);
for(const k of ["code","state","error","error_description"]){const v=q.get(k);if(v)target.searchParams.set(k,v)}
setTimeout(()=>location.replace(target.toString()),250);
</script>
